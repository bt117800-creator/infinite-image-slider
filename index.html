<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Image Slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <main class="page">
        <h1>Infinite Image Slider</h1>
        <p class="subtitle">Explore beautiful places around the world</p>

        <section class="slider" aria-label="Image gallery">
            <div class="slider-viewport">
                <div class="slider-track">

                    <div class="slide">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85"
                             alt="Beautiful green landscape">
                        <div class="caption">Beautiful Nature</div>
                    </div>

                    <div class="slide">
                        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=85"
                             alt="Ocean waves">
                        <div class="caption">Ocean Waves</div>
                    </div>

                    <div class="slide">
                        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=85"
                             alt="Mountain beneath a starry sky">
                        <div class="caption">Mountain Views</div>
                    </div>

                    <div class="slide">
                        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=85"
                             alt="Lake surrounded by mountains">
                        <div class="caption">Peaceful Lake</div>
                    </div>

                </div>

                <button class="slider-button prev"
                        type="button"
                        aria-label="Previous image">&#10094;</button>

                <button class="slider-button next"
                        type="button"
                        aria-label="Next image">&#10095;</button>
            </div>

            <div class="slider-dots" aria-label="Choose an image"></div>

            <p class="image-counter" aria-live="polite"></p>
        </section>
    </main>

</body>
</html>
